<!doctype html>
<html lang="bs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fcfafc">
  <meta name="description" content="Raskrinkavanje alatnica: online alati i ekstenzije.">
  <title>Raskrinkavanje alatnica</title>
  <link rel="stylesheet" href="./style.css">
  <script src="./tools.js" defer></script>
  <script src="./app.js" defer></script>
</head>
<body>
  <header class="header">
    <div class="shell head-inner">
      <div class="brand" aria-label="Raskrinkavanje alatnica">
        <span class="clown-logo" role="img" aria-label="Logo Raskrinkavanja: klovn i maska"></span>
        <div class="brand-words"><span class="brand-kicker">RASKRINKAVANJE<span class="accent-dot">.</span>BA</span><strong>Alatnica<span class="accent-dot">.</span></strong></div>
      </div>
      <button type="button" id="installTop" class="head-link">Upute za instalaciju <span aria-hidden="true">↗</span></button>
    </div>
  </header>

  <main class="shell">
    <div class="page-title"><h1>Alati na jednom mjestu<span class="accent-dot">.</span></h1></div>

    <section class="tool-section" aria-labelledby="onlineTitle">
      <div class="section-title"><h2 id="onlineTitle">Online alati</h2><span class="section-line"></span></div>
      <div class="tool-grid online-grid" id="onlineGrid"></div>
    </section>

    <section class="tool-section extensions" aria-labelledby="extensionTitle">
      <div class="section-title"><h2 id="extensionTitle">Ekstenzije</h2><span class="section-line"></span></div>
      <div class="tool-grid extension-grid" id="extensionGrid"></div>
    </section>

    <footer class="footer">
      <button id="installFooter" type="button">Kako instalirati ekstenzije <span aria-hidden="true">↗</span></button>
      <button id="panelFooter" type="button">Alatnica u bočnom panelu <span aria-hidden="true">↗</span></button>
    </footer>
  </main>

  <dialog id="guideDialog" aria-labelledby="dialogTitle">
    <div class="dialog-inner">
      <div class="dialog-heading"><div><div class="dialog-eyebrow" id="dialogLabel">UPUTE</div><h2 id="dialogTitle">Upute</h2></div><button id="closeDialog" type="button" class="close" aria-label="Zatvori">×</button></div>
      <div id="dialogContent"></div>
    </div>
  </dialog>
</body>
</html>
